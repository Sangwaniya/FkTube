<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kaam karle na</title>
<style>
  :root{
    --text:#f2f3f8; --muted:#a2a8c4; --accent:#ff4d5e; --accent2:#ff9e40; --green:#34d399; --violet:#a78bfa;
    --display:"SF Pro Display","Segoe UI Variable Display","Segoe UI","Nirmala UI",system-ui,sans-serif;
    --body:"SF Pro Text","Segoe UI Variable Text","Segoe UI","Nirmala UI",system-ui,sans-serif;
    --glass:linear-gradient(155deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
    --glass-border:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    width:340px; font-family:var(--body); color:var(--text);
    background:radial-gradient(420px 320px at 100% 0%,#241241,transparent 60%),linear-gradient(160deg,#08060d,#100e1a);
    padding:20px; position:relative; overflow:hidden;
  }
  .aurora{position:absolute;inset:-30%;filter:blur(40px);pointer-events:none;
    background:radial-gradient(240px 240px at 20% 10%,rgba(255,77,94,.3),transparent 60%),radial-gradient(260px 260px at 90% 40%,rgba(167,139,250,.28),transparent 60%);}
  .wrap{position:relative;z-index:1;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 20px rgba(255,77,94,.4),inset 0 1px 0 rgba(255,255,255,.5);}
  .title{font-family:var(--display);font-size:13px;font-weight:900;line-height:1.15;letter-spacing:-.3px;
    background:linear-gradient(90deg,#fff,#ffd0c2,#dcc9ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .langbtns{display:flex;gap:4px;}
  .langbtns button{background:rgba(255,255,255,.06);border:1px solid var(--glass-border);color:var(--muted);
    font-family:var(--body);font-size:10px;font-weight:700;padding:5px 9px;border-radius:99px;cursor:pointer;transition:.18s;}
  .langbtns button.active{background:linear-gradient(135deg,rgba(255,77,94,.35),rgba(255,158,64,.3));color:#fff;}
  .meme{font-family:var(--display);font-size:16px;font-weight:800;line-height:1.25;margin:14px 0;letter-spacing:-.3px;
    background:linear-gradient(92deg,#fff,#ffb9c0,#c9b6ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:var(--glass);border:1px solid var(--glass-border);border-radius:15px;padding:12px 8px;text-align:center;
    backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);}
  .stat .v{font-family:var(--display);font-size:20px;font-weight:900;}
  .stat .l{font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  .status{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:11px 13px;font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:600;backdrop-filter:blur(16px);}
  .status.snoozed{border-color:rgba(255,77,94,.4);color:#ffb3ba;}
  .btn{width:100%;border:none;border-radius:15px;padding:13px;font-family:var(--body);font-size:13px;font-weight:800;cursor:pointer;margin-bottom:8px;transition:transform .14s,box-shadow .2s;}
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#200800;box-shadow:0 8px 20px rgba(255,77,94,.4),inset 0 1px 0 rgba(255,255,255,.5);}
  .btn-ghost{background:var(--glass);border:1px solid var(--glass-border);color:var(--text);backdrop-filter:blur(16px);}
  .foot{text-align:center;font-size:10px;color:var(--muted);margin-top:6px;}
  .foot b{color:var(--accent2);}
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="logo">🔥</div>
        <div class="title" id="title"></div>
      </div>
      <div class="langbtns" id="langbtns"></div>
    </div>
    <div class="meme" id="meme"></div>
    <div class="stats">
      <div class="stat"><div class="v" id="s-streak">0</div><div class="l" id="l-streak">Streak</div></div>
      <div class="stat"><div class="v" id="s-done">0</div><div class="l" id="l-done">Done</div></div>
      <div class="stat"><div class="v" id="s-tasks">0</div><div class="l" id="l-pending">Pending</div></div>
    </div>
    <div class="status" id="status"></div>
    <button class="btn btn-primary" id="open-yt"></button>
    <button class="btn btn-ghost" id="end-snooze" hidden></button>
    <div class="foot" id="foot"></div>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
